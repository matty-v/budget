<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419"/>
      <stop offset="100%" style="stop-color:#0a0d14"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGradient)"/>

  <!-- Ascending line with dip -->
  <path d="M 28 146 L 72 79 L 106 101 L 166 28"
        fill="none"
        stroke="url(#neonGradient)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Data points -->
  <circle cx="28" cy="146" r="10" fill="#00d4ff" filter="url(#nodeGlow)"/>
  <circle cx="72" cy="79" r="10" fill="#22d3ee" filter="url(#nodeGlow)"/>
  <circle cx="106" cy="101" r="10" fill="#6ee7b7" filter="url(#nodeGlow)"/>
  <circle cx="166" cy="28" r="10" fill="#a78bfa" filter="url(#nodeGlow)"/>
</svg>
