<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419"/>
      <stop offset="100%" style="stop-color:#0a0d14"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>

  <!-- Ascending line with dip -->
  <path d="M 70 390 L 190 210 L 280 270 L 442 70"
        fill="none"
        stroke="url(#neonGradient)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Data points -->
  <circle cx="70" cy="390" r="26" fill="#00d4ff" filter="url(#nodeGlow)"/>
  <circle cx="190" cy="210" r="26" fill="#22d3ee" filter="url(#nodeGlow)"/>
  <circle cx="280" cy="270" r="26" fill="#6ee7b7" filter="url(#nodeGlow)"/>
  <circle cx="442" cy="70" r="26" fill="#a78bfa" filter="url(#nodeGlow)"/>
</svg>
