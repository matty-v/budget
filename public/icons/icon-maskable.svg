<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1419"/>
      <stop offset="100%" style="stop-color:#0a0d14"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- Ascending line with dip - smaller for safe zone -->
  <path d="M 100 360 L 200 200 L 270 250 L 412 90"
        fill="none"
        stroke="url(#neonGradient)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Data points -->
  <circle cx="100" cy="360" r="22" fill="#00d4ff" filter="url(#nodeGlow)"/>
  <circle cx="200" cy="200" r="22" fill="#22d3ee" filter="url(#nodeGlow)"/>
  <circle cx="270" cy="250" r="22" fill="#6ee7b7" filter="url(#nodeGlow)"/>
  <circle cx="412" cy="90" r="22" fill="#a78bfa" filter="url(#nodeGlow)"/>
</svg>
