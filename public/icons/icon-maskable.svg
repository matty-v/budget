<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full background for maskable icon (safe zone is inner 80%) -->
  <rect width="512" height="512" fill="#0f172a"/>
  <g transform="translate(128, 128)">
    <!-- Wallet body -->
    <rect x="16" y="48" width="224" height="160" rx="16" fill="#22c55e"/>
    <!-- Wallet flap -->
    <path d="M16 88 L16 68 Q16 48 36 48 L220 48 Q240 48 240 68 L240 88" fill="#16a34a"/>
    <!-- Card slot -->
    <rect x="152" y="96" width="72" height="52" rx="8" fill="#0f172a"/>
    <!-- Dollar sign -->
    <text x="128" y="180" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
