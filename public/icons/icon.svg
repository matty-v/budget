<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ascending line with dip -->
  <path d="M 140 780 L 380 420 L 560 540 L 884 140"
        fill="none"
        stroke="url(#neonGradient)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Data points -->
  <circle cx="140" cy="780" r="52" fill="#00d4ff" filter="url(#nodeGlow)"/>
  <circle cx="380" cy="420" r="52" fill="#22d3ee" filter="url(#nodeGlow)"/>
  <circle cx="560" cy="540" r="52" fill="#6ee7b7" filter="url(#nodeGlow)"/>
  <circle cx="884" cy="140" r="52" fill="#a78bfa" filter="url(#nodeGlow)"/>
</svg>
